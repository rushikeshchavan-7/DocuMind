# Hugging Face Spaces Deployment Reference
# Each service is deployed as a separate HF Space (Docker SDK)
# Replace <HF_USER> with your Hugging Face username throughout

# ─────────────────────────────────────────────
# Space 1: documind-api (.NET Backend)
# ─────────────────────────────────────────────
# HF Space name: documind-api
# SDK: Docker
# Dockerfile path: server/Dockerfile (copy server/ contents to Space root)
# URL: https://<HF_USER>-documind-api.hf.space
#
# Environment Variables (set in Space Settings > Variables):
#   ASPNETCORE_ENVIRONMENT         = Production
#   ASPNETCORE_URLS                = http://+:7860
#   ConnectionStrings__DefaultConnection = <your Neon.tech connection string>
#   Jwt__Secret                    = <generate a random 64-char string>
#   Security__EncryptionKey        = <generate a random 32-char string>
#   AiEngine__BaseUrl              = https://<HF_USER>-documind-ai.hf.space
#   Storage__Path                  = ./Storage/Documents
#   Cors__Origins__0               = https://documind-rag.netlify.app
#   Cors__Origins__1               = http://localhost:4200

# ─────────────────────────────────────────────
# Space 2: documind-ai (Python AI Engine)
# ─────────────────────────────────────────────
# HF Space name: documind-ai
# SDK: Docker
# Dockerfile path: ai-engine/Dockerfile (copy ai-engine/ contents to Space root)
# URL: https://<HF_USER>-documind-ai.hf.space
#
# Environment Variables (set in Space Settings > Variables):
#   LLM_PROVIDER   = groq
#   EMBED_PROVIDER = default
#   GROQ_API_KEY   = <your Groq API key>
#   GROQ_MODEL     = meta-llama/llama-4-maverick-17b-128e-instruct
#   CORS_ORIGINS   = https://documind-rag.netlify.app,https://<HF_USER>-documind-api.hf.space,http://localhost:4200
#   CHROMA_PERSIST_DIR = ./data/chromadb
#   UPLOAD_DIR     = ./data/uploads
