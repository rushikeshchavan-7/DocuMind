version: "3.9"

services:
  # ─── PostgreSQL Database ───────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: documind-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: documind
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Ollama Local LLM ─────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: documind-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─── .NET Core Backend API ─────────────────────────────────────
  backend:
    build:
      context: ../server
      dockerfile: ../docker/Dockerfile.backend
    container_name: documind-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      ASPNETCORE_URLS: http://+:5000
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=documind;Username=postgres;Password=postgres"
      AiEngine__BaseUrl: http://ai-engine:8000
      Jwt__Secret: "DocuMind-SuperSecret-JWT-Key-2024-Must-Be-At-Least-32-Bytes!"
      Jwt__Issuer: DocuMind
      Jwt__Audience: DocuMind-Client
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - document_storage:/app/Storage/Documents

  # ─── Python AI Engine ──────────────────────────────────────────
  ai-engine:
    build:
      context: ../ai-engine
      dockerfile: ../docker/Dockerfile.ai-engine
    container_name: documind-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2
      CHROMA_PERSIST_DIR: /app/data/chromadb
      UPLOAD_DIR: /app/data/uploads
    depends_on:
      - ollama
    volumes:
      - ai_data:/app/data

  # ─── Angular Frontend (Dev) ────────────────────────────────────
  frontend:
    build:
      context: ../client/documind-client
      dockerfile: ../../docker/Dockerfile.frontend
    container_name: documind-ui
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  ollama_data:
  document_storage:
  ai_data:
