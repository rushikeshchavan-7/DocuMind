# Render.com Blueprint — deploy both backend services
# Usage: Connect this repo to Render, it auto-detects this file

services:
  # .NET Backend API
  - type: web
    name: documind-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false  # Set manually in Render dashboard
      - key: Jwt__Secret
        generateValue: true
      - key: Security__EncryptionKey
        generateValue: true
      - key: AiEngine__BaseUrl
        value: https://documind-ai-pkng.onrender.com
      - key: Storage__Path
        value: ./Storage/Documents
      - key: ASPNETCORE_URLS
        value: http://+:10000
      - key: Cors__Origins__0
        value: https://documind-rag.netlify.app
      - key: Cors__Origins__1
        value: http://localhost:4200

  # Python AI Engine
  - type: web
    name: documind-ai
    runtime: docker
    dockerfilePath: ./ai-engine/Dockerfile
    dockerContext: ./ai-engine
    plan: free
    envVars:
      - key: LLM_PROVIDER
        value: groq
      - key: EMBED_PROVIDER
        value: default
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CORS_ORIGINS
        value: https://documind-rag.netlify.app,https://documind-api-i1j1.onrender.com,http://localhost:4200
      - key: CHROMA_PERSIST_DIR
        value: ./data/chromadb
      - key: UPLOAD_DIR
        value: ./data/uploads
